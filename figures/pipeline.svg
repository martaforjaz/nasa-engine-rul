<svg xmlns="http://www.w3.org/2000/svg" width="960" height="230" viewBox="0 0 960 230" font-family="Arial,sans-serif" role="img"><title>pipeline</title><rect width="960" height="230" fill="white"/><text x="28" y="50" fill="#102b59" font-size="30" font-weight="700">From engine telemetry to remaining-life estimates</text><rect x="28" y="86" width="211" height="43" rx="21" fill="#102b59"/><text x="42" y="114" fill="white" font-size="18" font-weight="700">I. Ingest</text><text x="35" y="166" fill="#102b59" font-size="17" font-weight="700">NASA C-MAPSS FD001</text><text x="35" y="193" fill="#506078" font-size="16" font-weight="400">Simulated engine cycles</text><text x="240" y="168" fill="#915883" font-size="19" font-weight="700">→</text><rect x="262" y="86" width="211" height="43" rx="21" fill="#102b59"/><text x="276" y="114" fill="white" font-size="18" font-weight="700">II. Prepare</text><text x="269" y="166" fill="#102b59" font-size="17" font-weight="700">20-cycle trailing features</text><text x="269" y="193" fill="#506078" font-size="16" font-weight="400">No future readings</text><text x="474" y="168" fill="#915883" font-size="19" font-weight="700">→</text><rect x="496" y="86" width="211" height="43" rx="21" fill="#102b59"/><text x="510" y="114" fill="white" font-size="18" font-weight="700">III. Fit</text><text x="503" y="166" fill="#102b59" font-size="17" font-weight="700">100 training engines</text><text x="503" y="193" fill="#506078" font-size="16" font-weight="400">Age baseline + boosting</text><text x="708" y="168" fill="#915883" font-size="19" font-weight="700">→</text><rect x="730" y="86" width="211" height="43" rx="21" fill="#102b59"/><text x="744" y="114" fill="white" font-size="18" font-weight="700">IV. Evaluate</text><text x="737" y="166" fill="#102b59" font-size="17" font-weight="700">100 test engines</text><text x="737" y="193" fill="#506078" font-size="16" font-weight="400">One prediction per engine</text></svg>
